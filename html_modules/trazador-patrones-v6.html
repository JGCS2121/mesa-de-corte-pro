<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trazador de Patrones v4</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
  body { background:#1a1a2e; color:#fff; font-family:sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; }

  /* HEADER */
  #header { background:#16213e; padding:8px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #0f3460; flex-shrink:0; }
  #header h1 { font-size:14px; color:#00d4ff; }
  #header-right { display:flex; gap:8px; align-items:center; }

  /* TOOLBAR */
  #toolbar { background:#16213e; display:flex; align-items:center; gap:4px; padding:6px 10px; border-bottom:1px solid #0f3460; flex-shrink:0; overflow-x:auto; }
  .tool-btn { background:#0f3460; border:none; color:#aaa; border-radius:8px; padding:6px 10px; font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:44px; }
  .tool-btn.active { background:#00d4ff; color:#000; }
  .tool-btn span { font-size:16px; }
  .sep { width:1px; background:#0f3460; height:36px; margin:0 2px; }

  /* LAYER INDICATOR */
  #layer-bar { background:#0d1b2a; padding:4px 12px; font-size:11px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  #layer-badge { padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold; }
  .badge-basic { background:#555; color:#fff; }
  .badge-transform { background:#00d4ff; color:#000; }

  /* CANVAS */
  #canvas-wrap { flex:1; position:relative; overflow:hidden; }
  canvas { position:absolute; top:0; left:0; }
  #canvas-base { z-index:1; }
  #canvas-draw { z-index:2; }
  #canvas-ui   { z-index:3; }

  /* BOTTOM BAR */
  #bottom-bar { background:#16213e; border-top:1px solid #0f3460; padding:6px 10px; display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  .bb-label { font-size:10px; color:#aaa; }
  select, input[type=number] { background:#0f3460; color:#fff; border:1px solid #00d4ff44; border-radius:6px; padding:4px 6px; font-size:12px; }
  .color-dot { width:22px; height:22px; border-radius:50%; border:2px solid #fff; cursor:pointer; }

  /* BUTTONS */
  .btn { padding:7px 14px; border:none; border-radius:8px; font-size:12px; cursor:pointer; font-weight:bold; }
  .btn-cyan   { background:#00d4ff; color:#000; }
  .btn-green  { background:#00c853; color:#000; }
  .btn-red    { background:#e53935; color:#fff; }
  .btn-orange { background:#ff6d00; color:#fff; }
  .btn-gray   { background:#444; color:#fff; }

  /* MODALS */
  .modal-bg { position:fixed; inset:0; background:#000a; z-index:100; display:flex; align-items:center; justify-content:center; }
  .modal { background:#16213e; border:1px solid #00d4ff44; border-radius:14px; padding:20px; width:88%; max-width:360px; }
  .modal h2 { color:#00d4ff; margin-bottom:14px; font-size:15px; }
  .modal input, .modal select { width:100%; margin-bottom:10px; padding:8px; background:#0f3460; color:#fff; border:1px solid #00d4ff44; border-radius:8px; font-size:13px; }
  .modal-btns { display:flex; gap:8px; margin-top:6px; }
  .modal-btns button { flex:1; }

  /* LIBRARY LIST */
  #lib-list { max-height:200px; overflow-y:auto; margin-bottom:10px; }
  .lib-item { background:#0f3460; border-radius:8px; padding:8px 10px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .lib-item:hover { background:#1a4a80; }
  .lib-item-name { font-size:13px; }
  .lib-item-meta { font-size:10px; color:#aaa; }
  .lib-item-del { background:#e53935; border:none; color:#fff; border-radius:6px; padding:3px 8px; font-size:11px; cursor:pointer; }

  /* MEASURE POPUP */
  #measure-popup { position:fixed; z-index:90; background:#16213e; border:2px solid #00d4ff; border-radius:12px; padding:14px; min-width:200px; box-shadow:0 4px 20px #000; }
  #measure-popup h3 { color:#00d4ff; font-size:13px; margin-bottom:8px; }
  #mp-result { font-size:22px; font-weight:bold; color:#fff; margin-bottom:10px; }
  #mp-correct-row { display:flex; gap:6px; align-items:center; margin-bottom:10px; }
  #mp-correct-row input { width:80px; padding:6px; background:#0f3460; color:#fff; border:1px solid #00d4ff; border-radius:6px; font-size:14px; }
  #mp-correct-row button { padding:6px 12px; background:#00c853; border:none; border-radius:6px; color:#000; font-weight:bold; cursor:pointer; font-size:12px; }
  #mp-close { width:100%; padding:6px; background:#444; border:none; border-radius:6px; color:#fff; cursor:pointer; font-size:12px; }


  /* MIRROR */
  #mirror-bar { background:#0d1b2a; border-bottom:1px solid #0f3460; padding:4px 10px; display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .mirror-btn { padding:4px 12px; border:none; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer; }
  .mirror-btn.on  { background:#ff6d00; color:#fff; }
  .mirror-btn.off { background:#0f3460; color:#aaa; }
  #mirror-line-x { position:absolute; z-index:5; pointer-events:none; top:0; left:50%; width:2px; height:100%; background:repeating-linear-gradient(to bottom,#ff6d00 0,#ff6d00 8px,transparent 8px,transparent 16px); display:none; }
  #mirror-line-y { position:absolute; z-index:5; pointer-events:none; left:0; top:50%; width:100%; height:2px; background:repeating-linear-gradient(to right,#ff6d00 0,#ff6d00 8px,transparent 8px,transparent 16px); display:none; }


  /* PROJECTION MODE */
  #proj-overlay { position:fixed; inset:0; background:#000; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #proj-canvas  { background:#000; display:block; }
  #proj-controls { position:fixed; bottom:0; left:0; right:0; background:#000c; padding:10px; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; z-index:201; }
  #proj-scale-label { color:#fff; font-size:13px; min-width:80px; text-align:center; }

  /* CALIBRATION */
  #calib-modal .modal { max-width:400px; }
  #calib-box { width:100%; height:120px; border:3px solid #00d4ff; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#00d4ff; font-size:13px; margin-bottom:12px; position:relative; background:#0f3460; }
  #calib-box span { font-size:36px; font-weight:bold; }
  .calib-step { background:#0f3460; border-radius:8px; padding:10px; margin-bottom:10px; font-size:12px; line-height:1.6; }
  .calib-step b { color:#00d4ff; }

  /* IMPORT */
  #import-img-preview { max-width:100%; border-radius:8px; margin-bottom:10px; display:none; }

  #tela-cm-badge { font-size:11px; color:#00d4ff; }
  .hidden { display:none !important; }

  /* CAMERA SCAN MODAL */
  #cam-vid { display:block; width:100%; height:auto; max-height:48vh; object-fit:contain; background:#000; border-radius:8px; }
  #cam-edge-prev, #cam-preview { width:100%; border-radius:8px; background:#000; max-height:30vh; object-fit:contain; display:block; }
  .cam-phase-badge { display:inline-block; border-radius:6px; padding:2px 8px; font-size:10px; font-weight:bold; }
  .cam-card { border-radius:10px; padding:12px; margin-bottom:10px; }
  .cam-card-green { background:#0a2a1a; border:1px solid #00c85344; }
  .cam-card-blue  { background:#0a1a2a; border:1px solid #00d4ff44; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:18px;">✂️</span>
    <h1>Trazador de Patrones v4</h1>
  </div>
  <div id="header-right">
    <button class="btn btn-orange" onclick="showCalib()" style="font-size:11px;">📐 Calibrar</button>
    <button class="btn btn-cyan" onclick="showProjection()" style="font-size:11px;">📽️ Proyectar</button>
    <button class="btn" onclick="openCamModal()" style="font-size:11px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;padding:7px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">📷 Escanear</button>
    <button class="btn btn-gray" onclick="document.getElementById('import-file').click()" style="font-size:11px;">📥 Importar</button>
    <input type="file" id="import-file" accept="image/*" style="display:none" onchange="importImage(this)">
    <button class="btn btn-gray" onclick="showLibrary()" style="font-size:11px;">📂 Biblioteca</button>
    <button class="btn btn-green" onclick="showSaveModal()" style="font-size:11px;">💾 Guardar</button>
  </div>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tool-btn active" id="tb-lapiz" onclick="setTool('lapiz')"><span>✏️</span>Lápiz</button>
  <button class="tool-btn" id="tb-linea"  onclick="setTool('linea')"><span>📏</span>Línea</button>
  <button class="tool-btn" id="tb-rect"   onclick="setTool('rect')"><span>⬜</span>Rect</button>
  <button class="tool-btn" id="tb-curva"  onclick="setTool('curva')"><span>〜</span>Curva</button>
  <div class="sep"></div>
  <button class="tool-btn" id="tb-borrar" onclick="setTool('borrar')"><span>🗑️</span>Borrar</button>
  <button class="tool-btn" onclick="undo()"><span>↩️</span>Undo</button>
  <div class="sep"></div>
  <button class="tool-btn" onclick="clearDraw()" style="color:#ff6d6d;"><span>🧹</span>Limpiar</button>
</div>

<!-- LAYER BAR -->
<div id="layer-bar">
  <span class="bb-label">Capa activa:</span>
  <span id="layer-badge" class="badge-transform">✏️ Transformación</span>
  <span id="basic-status" style="font-size:10px;color:#aaa;margin-left:auto;">Sin básico cargado</span>
  <button id="btn-toggle-basic" class="btn btn-gray" style="font-size:10px;padding:3px 8px;" onclick="toggleBasicVisibility()">👁 Básico</button>
</div>


<!-- MIRROR BAR -->
<div id="mirror-bar">
  <span style="font-size:11px;color:#aaa;">Espejo:</span>
  <button class="mirror-btn off" id="mb-v" onclick="toggleMirror('v')">↔️ Vertical</button>
  <button class="mirror-btn off" id="mb-h" onclick="toggleMirror('h')">↕️ Horizontal</button>
  <button class="mirror-btn off" id="mb-both" onclick="toggleMirror('both')">⊞ Ambos</button>
  <button class="mirror-btn" style="background:#e53935;color:#fff;" onclick="applyMirror()">✅ Aplicar espejo</button>
</div>

<!-- CANVAS -->
<div id="canvas-wrap">
  
  <div id="mirror-line-x"></div>
  <div id="mirror-line-y"></div>

  <canvas id="canvas-base"></canvas>
  <canvas id="canvas-draw"></canvas>
  <canvas id="canvas-ui"></canvas>
</div>

<!-- BOTTOM BAR -->
<div id="bottom-bar">
  <span class="bb-label">Color</span>
  <span class="bb-label">Color</span>
  <div style="display:flex;gap:5px;align-items:center;">
    <div class="color-dot" style="background:#00FF00;border-color:#00FF00;" onclick="setColor('#00FF00')" title="Verde neón (tela oscura)"></div>
    <div class="color-dot" style="background:#FF6600;border-color:#FF6600;" onclick="setColor('#FF6600')" title="Naranja (tela oscura)"></div>
    <div class="color-dot" style="background:#ffffff;border-color:#aaa;" onclick="setColor('#ffffff')" title="Blanco"></div>
    <div class="color-dot" style="background:#00d4ff;border-color:#00d4ff;" onclick="setColor('#00d4ff')" title="Cian"></div>
    <div class="color-dot" style="background:#e53935;border-color:#e53935;" onclick="setColor('#e53935')" title="Rojo"></div>
    <div class="color-dot" id="color-dot" style="background:#00d4ff" onclick="document.getElementById('color-pick').click()" title="Personalizado">+</div>
  </div>
  <input type="color" id="color-pick" value="#00d4ff" style="display:none" onchange="setColor(this.value)">
  <span class="bb-label">Grosor</span>
  <select id="sel-grosor" onchange="setGrosor(this.value)">
    <option value="2">2px</option><option value="4">4px</option>
    <option value="7" selected>7px</option><option value="12">12px</option><option value="18">18px</option>
  </select>
  <span class="bb-label">Tela</span>
  <select id="sel-tela" onchange="setTela(this.value)">
    <option value="90">90 cm</option><option value="110" selected>110 cm</option>
    <option value="140">140 cm</option><option value="150">150 cm</option>
  </select>
  <span id="tela-cm-badge">📐 110 cm</span>
  <span class="bb-label" style="margin-left:auto;" id="zoom-label">Zoom: 100%</span>
</div>

<!-- MEASURE POPUP -->
<div id="measure-popup" class="hidden">
  <h3>📏 Longitud de línea</h3>
  <div id="mp-result">0.0 cm</div>
  <div id="mp-correct-row">
    <input type="number" id="mp-target" placeholder="Corregir a cm" step="0.5">
    <button onclick="applyCorrection()">✅ Ajustar</button>
  </div>
  <button id="mp-close" onclick="closeMeasurePopup()">Cerrar</button>
</div>

<!-- SAVE MODAL -->
<div id="modal-save" class="modal-bg hidden">
  <div class="modal">
    <h2>💾 Guardar Patrón</h2>
    <input type="text" id="save-name" placeholder="Nombre (ej: Blusa básica)">
    <input type="text" id="save-sku"  placeholder="SKU / Referencia (ej: 431)">
    <select id="save-type">
      <option value="basico">🔒 Guardar como BÁSICO</option>
      <option value="transformacion" selected>✏️ Guardar como Transformación</option>
    </select>
    <div class="modal-btns">
      <button class="btn btn-gray" onclick="closeModal('modal-save')">Cancelar</button>
      <button class="btn btn-green" onclick="savePattern()">Guardar</button>
    </div>
  </div>
</div>

<!-- LIBRARY MODAL -->
<div id="modal-library" class="modal-bg hidden">
  <div class="modal">
    <h2>📂 Biblioteca de Patrones</h2>
    <div id="lib-list"></div>
    <div style="margin-bottom:10px;">
      <button class="btn btn-cyan" style="width:100%;font-size:12px;" onclick="loadSelectedAsBasic()">🔒 Cargar como BÁSICO (fondo)</button>
    </div>
    <button class="btn btn-gray" style="width:100%;" onclick="closeModal('modal-library')">Cerrar</button>
  </div>
</div>

<!-- CONFIRM CLEAR -->
<div id="modal-clear" class="modal-bg hidden">
  <div class="modal">
    <h2>🧹 Limpiar capa</h2>
    <p style="margin-bottom:14px;font-size:13px;">¿Limpiar solo la capa de transformación o todo?</p>
    <div class="modal-btns">
      <button class="btn btn-gray" onclick="closeModal('modal-clear')">Cancelar</button>
      <button class="btn btn-orange" onclick="doClearDraw();closeModal('modal-clear')">Solo transformación</button>
      <button class="btn btn-red" onclick="doClearAll();closeModal('modal-clear')">Todo</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const canvasBase = document.getElementById('canvas-base');
const canvasDraw = document.getElementById('canvas-draw');
const canvasUI   = document.getElementById('canvas-ui');
const ctxBase = canvasBase.getContext('2d');
const ctxDraw = canvasDraw.getContext('2d');
const ctxUI   = canvasUI.getContext('2d');

let W, H, dpr;
let tool = 'lapiz';
let color = '#00d4ff';
let grosor = 2;
let telaCm = 110;
let pxPerCm = 1;

let drawing = false;
let startX, startY, lastX, lastY;
let points = []; // for pencil
let history = [];
let basicSnap = null; // ImageData of basic layer
let basicVisible = true;

// zoom/pan
let scale = 1, offX = 0, offY = 0;
let pinching = false, pinchDist0 = 0, scale0 = 1, pinchMidX = 0, pinchMidY = 0, offX0 = 0, offY0 = 0;
let panning = false, panX0 = 0, panY0 = 0, offXp = 0, offYp = 0;

// line correction
let lastLineP1 = null, lastLineP2 = null;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  dpr = window.devicePixelRatio || 1;
  [canvasBase, canvasDraw, canvasUI].forEach(c => {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.getContext('2d').scale(dpr, dpr);
  });
  pxPerCm = W / telaCm;
  redrawBase();
  redrawDraw();
}

// ─── TELA ────────────────────────────────────────────────────────────────────
function setTela(v) {
  telaCm = parseInt(v);
  pxPerCm = W / telaCm;
  document.getElementById('tela-cm-badge').textContent = '📐 ' + telaCm + ' cm';
  redrawBase();
}

// ─── BASE LAYER (grid + basic) ───────────────────────────────────────────────
function redrawBase() {
  ctxBase.clearRect(0, 0, W, H);
  ctxBase.save();
  ctxBase.translate(offX, offY);
  ctxBase.scale(scale, scale);

  // grid
  const cmPx = pxPerCm;
  ctxBase.strokeStyle = '#ffffff10';
  ctxBase.lineWidth = 0.5;
  for (let x = 0; x < W / scale + 200; x += cmPx) {
    ctxBase.beginPath(); ctxBase.moveTo(x, -200); ctxBase.lineTo(x, H / scale + 200); ctxBase.stroke();
  }
  for (let y = 0; y < H / scale + 200; y += cmPx) {
    ctxBase.beginPath(); ctxBase.moveTo(-200, y); ctxBase.lineTo(W / scale + 200, y); ctxBase.stroke();
  }
  // 5cm marks
  ctxBase.strokeStyle = '#ffffff22';
  ctxBase.lineWidth = 1;
  for (let x = 0; x < W / scale + 200; x += cmPx * 5) {
    ctxBase.beginPath(); ctxBase.moveTo(x, -200); ctxBase.lineTo(x, H / scale + 200); ctxBase.stroke();
  }
  // tela border
  ctxBase.strokeStyle = '#ff6d0066';
  ctxBase.lineWidth = 2;
  ctxBase.strokeRect(0, 0, telaCm * cmPx, H / scale);

  ctxBase.restore();

  // basic pattern (drawn in screen space already stored)
  if (basicSnap && basicVisible) {
    ctxBase.putImageData(basicSnap, 0, 0);
  }
}

// ─── DRAW LAYER ──────────────────────────────────────────────────────────────
let drawSnap = null;
function saveHistory() {
  history.push(ctxDraw.getImageData(0, 0, canvasDraw.width, canvasDraw.height));
  if (history.length > 30) history.shift();
}
function redrawDraw() {
  if (drawSnap) ctxDraw.putImageData(drawSnap, 0, 0);
}

// ─── TOOLS ───────────────────────────────────────────────────────────────────
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tb-' + t);
  if (el) el.classList.add('active');
}
function setColor(v) { color = v; document.getElementById('color-dot').style.background = v; }
function setGrosor(v) { grosor = parseInt(v); }

function undo() {
  if (history.length === 0) return;
  ctxDraw.putImageData(history.pop(), 0, 0);
}

function clearDraw() { document.getElementById('modal-clear').classList.remove('hidden'); }
function doClearDraw() { ctxDraw.clearRect(0, 0, W * dpr, H * dpr); history = []; }
function doClearAll() { doClearDraw(); basicSnap = null; basicVisible = true; document.getElementById('basic-status').textContent = 'Sin básico cargado'; redrawBase(); }

// ─── COORDINATE HELPERS ──────────────────────────────────────────────────────
function toCanvas(ex, ey) {
  const rect = canvasUI.getBoundingClientRect();
  return { x: (ex - rect.left - offX) / scale, y: (ey - rect.top - offY) / scale };
}
function toScreen(cx, cy) { return { x: cx * scale + offX, y: cy * scale + offY }; }
function distPx(x1,y1,x2,y2) { return Math.sqrt((x2-x1)**2+(y2-y1)**2); }
function cmFromPx(px) { return px / pxPerCm; }

// ─── POINTER EVENTS ──────────────────────────────────────────────────────────
canvasUI.addEventListener('pointerdown', onDown);
canvasUI.addEventListener('pointermove', onMove);
canvasUI.addEventListener('pointerup',   onUp);
canvasUI.addEventListener('pointercancel', onUp);

let pointers = {};
function onDown(e) {
  e.preventDefault();
  pointers[e.pointerId] = e;
  const keys = Object.keys(pointers);

  if (keys.length === 2) {
    // two fingers → pinch/pan
    drawing = false;
    pinching = true;
    const [a, b] = keys.map(k => pointers[k]);
    pinchDist0 = distPx(a.clientX, a.clientY, b.clientX, b.clientY);
    scale0 = scale;
    pinchMidX = (a.clientX + b.clientX) / 2;
    pinchMidY = (a.clientY + b.clientY) / 2;
    offX0 = offX; offY0 = offY;
    return;
  }

  if (keys.length === 1) {
    const pt = toCanvas(e.clientX, e.clientY);
    startX = pt.x; startY = pt.y;
    lastX = pt.x; lastY = pt.y;
    drawing = true;
    if (tool === 'lapiz' || tool === 'borrar') {
      saveHistory();
      points = [pt];
    }
  }
}

function onMove(e) {
  e.preventDefault();
  pointers[e.pointerId] = e;
  const keys = Object.keys(pointers);

  if (pinching && keys.length === 2) {
    const [a, b] = keys.map(k => pointers[k]);
    const dist = distPx(a.clientX, a.clientY, b.clientX, b.clientY);
    const newScale = Math.max(0.5, Math.min(6, scale0 * dist / pinchDist0));
    const midX = (a.clientX + b.clientX) / 2;
    const midY = (a.clientY + b.clientY) / 2;
    const rect = canvasUI.getBoundingClientRect();
    const mx = midX - rect.left, my = midY - rect.top;
    offX = mx - (mx - offX0) * newScale / scale0 + (midX - pinchMidX);
    offY = my - (my - offY0) * newScale / scale0 + (midY - pinchMidY);
    scale = newScale;
    document.getElementById('zoom-label').textContent = 'Zoom: ' + Math.round(scale * 100) + '%';
    redrawBase();
    redrawDraw();
    ctxUI.clearRect(0, 0, W, H);
    return;
  }

  if (!drawing) return;
  const pt = toCanvas(e.clientX, e.clientY);

  ctxDraw.save();
  ctxDraw.translate(offX, offY);
  ctxDraw.scale(scale, scale);

  if (tool === 'lapiz') {
    ctxDraw.strokeStyle = color;
    ctxDraw.lineWidth = grosor / scale;
    ctxDraw.lineCap = 'round';
    ctxDraw.beginPath();
    ctxDraw.moveTo(lastX, lastY);
    ctxDraw.lineTo(pt.x, pt.y);
    ctxDraw.stroke();
    // real-time mirror
    if (mirrorMode === 'v' || mirrorMode === 'both') {
      const mxL = (W / scale - lastX) * 1, mxP = (W / scale - pt.x);
      ctxDraw.beginPath(); ctxDraw.moveTo(mxL, lastY); ctxDraw.lineTo(mxP, pt.y); ctxDraw.stroke();
    }
    if (mirrorMode === 'h' || mirrorMode === 'both') {
      const myL = (H / scale - lastY), myP = (H / scale - pt.y);
      ctxDraw.beginPath(); ctxDraw.moveTo(lastX, myL); ctxDraw.lineTo(pt.x, myP); ctxDraw.stroke();
    }
    lastX = pt.x; lastY = pt.y;
  } else if (tool === 'borrar') {
    ctxDraw.globalCompositeOperation = 'destination-out';
    ctxDraw.strokeStyle = 'rgba(0,0,0,1)';
    ctxDraw.lineWidth = (grosor * 5) / scale;
    ctxDraw.lineCap = 'round';
    ctxDraw.beginPath();
    ctxDraw.moveTo(lastX, lastY);
    ctxDraw.lineTo(pt.x, pt.y);
    ctxDraw.stroke();
    ctxDraw.globalCompositeOperation = 'source-over';
    lastX = pt.x; lastY = pt.y;
  }
  ctxDraw.restore();

  // preview for line/rect/curva
  if (tool === 'linea' || tool === 'rect' || tool === 'curva') {
    ctxUI.clearRect(0, 0, W, H);
    ctxUI.save();
    ctxUI.translate(offX, offY);
    ctxUI.scale(scale, scale);
    ctxUI.strokeStyle = color;
    ctxUI.lineWidth = grosor / scale;
    ctxUI.setLineDash([6 / scale, 3 / scale]);
    ctxUI.beginPath();
    if (tool === 'linea') {
      ctxUI.moveTo(startX, startY);
      ctxUI.lineTo(pt.x, pt.y);
    } else if (tool === 'rect') {
      ctxUI.strokeRect(startX, startY, pt.x - startX, pt.y - startY);
    } else if (tool === 'curva') {
      const mx = (startX + pt.x) / 2, my = (startY + pt.y) / 2 - 40 / scale;
      ctxUI.moveTo(startX, startY);
      ctxUI.quadraticCurveTo(mx, my, pt.x, pt.y);
    }
    ctxUI.stroke();
    ctxUI.setLineDash([]);
    // distance label
    const dPx = distPx(startX, startY, pt.x, pt.y) * scale;
    const dCm = cmFromPx(distPx(startX, startY, pt.x, pt.y));
    ctxUI.fillStyle = '#ffeb3b';
    ctxUI.font = `bold ${14 / scale}px sans-serif`;
    ctxUI.fillText(dCm.toFixed(1) + ' cm', (startX + pt.x) / 2 + 5 / scale, (startY + pt.y) / 2 - 5 / scale);
    ctxUI.restore();
  }
}

function onUp(e) {
  e.preventDefault();
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinching = false;
  if (!drawing) return;
  drawing = false;

  const pt = toCanvas(e.clientX, e.clientY);
  ctxUI.clearRect(0, 0, W, H);

  if (tool === 'linea' || tool === 'rect' || tool === 'curva') {
    saveHistory();
    ctxDraw.save();
    ctxDraw.translate(offX, offY);
    ctxDraw.scale(scale, scale);
    ctxDraw.strokeStyle = color;
    ctxDraw.lineWidth = grosor / scale;
    ctxDraw.lineCap = 'round';
    ctxDraw.beginPath();
    if (tool === 'linea') {
      ctxDraw.moveTo(startX, startY);
      ctxDraw.lineTo(pt.x, pt.y);
      ctxDraw.stroke();
      lastLineP1 = { x: startX, y: startY };
      lastLineP2 = { x: pt.x, y: pt.y };
      showMeasurePopup(e.clientX, e.clientY, startX, startY, pt.x, pt.y);
    } else if (tool === 'rect') {
      ctxDraw.strokeRect(startX, startY, pt.x - startX, pt.y - startY);
    } else if (tool === 'curva') {
      const mx = (startX + pt.x) / 2, my = (startY + pt.y) / 2 - 40 / scale;
      ctxDraw.moveTo(startX, startY);
      ctxDraw.quadraticCurveTo(mx, my, pt.x, pt.y);
      ctxDraw.stroke();
    }
    ctxDraw.restore();
  }
}

// ─── MEASURE POPUP ───────────────────────────────────────────────────────────
function showMeasurePopup(ex, ey, x1, y1, x2, y2) {
  const dCm = cmFromPx(distPx(x1, y1, x2, y2));
  const pop = document.getElementById('measure-popup');
  document.getElementById('mp-result').textContent = dCm.toFixed(1) + ' cm';
  document.getElementById('mp-target').value = '';
  pop.classList.remove('hidden');
  const rect = canvasUI.getBoundingClientRect();
  let px = ex - rect.left, py = ey - rect.top;
  if (px + 220 > W) px = W - 220;
  if (py + 160 > H) py = py - 160;
  pop.style.left = (px + rect.left) + 'px';
  pop.style.top  = (py + rect.top)  + 'px';
}

function closeMeasurePopup() {
  document.getElementById('measure-popup').classList.add('hidden');
  lastLineP1 = null; lastLineP2 = null;
}

function applyCorrection() {
  const target = parseFloat(document.getElementById('mp-target').value);
  if (!target || !lastLineP1) return;
  const p1 = lastLineP1, p2 = lastLineP2;
  const curPx = distPx(p1.x, p1.y, p2.x, p2.y);
  if (curPx === 0) return;
  const targetPx = target * pxPerCm;
  const ratio = targetPx / curPx;
  const newX2 = p1.x + (p2.x - p1.x) * ratio;
  const newY2 = p1.y + (p2.y - p1.y) * ratio;

  // undo last line and redraw corrected
  if (history.length > 0) ctxDraw.putImageData(history[history.length - 1], 0, 0);
  saveHistory();
  ctxDraw.save();
  ctxDraw.translate(offX, offY);
  ctxDraw.scale(scale, scale);
  ctxDraw.strokeStyle = color;
  ctxDraw.lineWidth = grosor / scale;
  ctxDraw.lineCap = 'round';
  ctxDraw.beginPath();
  ctxDraw.moveTo(p1.x, p1.y);
  ctxDraw.lineTo(newX2, newY2);
  ctxDraw.stroke();
  // endpoint dot
  ctxDraw.fillStyle = '#00c853';
  ctxDraw.beginPath();
  ctxDraw.arc(newX2, newY2, 4 / scale, 0, Math.PI * 2);
  ctxDraw.fill();
  ctxDraw.restore();
  document.getElementById('mp-result').textContent = target.toFixed(1) + ' cm ✅';
  lastLineP1 = { x: p1.x, y: p1.y };
  lastLineP2 = { x: newX2, y: newY2 };
}

// ─── MIRROR ──────────────────────────────────────────────────────────────────
let mirrorMode = null; // 'v', 'h', 'both', null

function toggleMirror(mode) {
  if (mirrorMode === mode) {
    mirrorMode = null;
    ['v','h','both'].forEach(m => {
      document.getElementById('mb-'+m).className = 'mirror-btn off';
    });
    document.getElementById('mirror-line-x').style.display = 'none';
    document.getElementById('mirror-line-y').style.display = 'none';
  } else {
    mirrorMode = mode;
    ['v','h','both'].forEach(m => {
      document.getElementById('mb-'+m).className = 'mirror-btn ' + (m === mode ? 'on' : 'off');
    });
    document.getElementById('mirror-line-x').style.display = (mode === 'v' || mode === 'both') ? 'block' : 'none';
    document.getElementById('mirror-line-y').style.display = (mode === 'h' || mode === 'both') ? 'block' : 'none';
  }
}

function applyMirror() {
  if (!mirrorMode) { alert('Primero activa un modo espejo'); return; }
  saveHistory();
  const snap = ctxDraw.getImageData(0, 0, canvasDraw.width, canvasDraw.height);
  const tmp = document.createElement('canvas');
  tmp.width = canvasDraw.width; tmp.height = canvasDraw.height;
  const tc = tmp.getContext('2d');
  tc.putImageData(snap, 0, 0);

  const cx = canvasDraw.width / 2;
  const cy = canvasDraw.height / 2;

  if (mirrorMode === 'v' || mirrorMode === 'both') {
    // mirror left→right: draw flipped version on right side
    ctxDraw.save();
    ctxDraw.translate(cx * 2 / dpr, 0);
    ctxDraw.scale(-1, 1);
    ctxDraw.drawImage(tmp, 0, 0, canvasDraw.width, canvasDraw.height, 0, 0, canvasDraw.width / dpr, canvasDraw.height / dpr);
    ctxDraw.restore();
  }
  if (mirrorMode === 'h' || mirrorMode === 'both') {
    // mirror top→bottom
    const snap2 = ctxDraw.getImageData(0, 0, canvasDraw.width, canvasDraw.height);
    const tmp2 = document.createElement('canvas');
    tmp2.width = canvasDraw.width; tmp2.height = canvasDraw.height;
    tmp2.getContext('2d').putImageData(snap2, 0, 0);
    ctxDraw.save();
    ctxDraw.translate(0, cy * 2 / dpr);
    ctxDraw.scale(1, -1);
    ctxDraw.drawImage(tmp2, 0, 0, canvasDraw.width, canvasDraw.height, 0, 0, canvasDraw.width / dpr, canvasDraw.height / dpr);
    ctxDraw.restore();
  }

  // turn off mirror mode after applying
  mirrorMode = null;
  ['v','h','both'].forEach(m => document.getElementById('mb-'+m).className = 'mirror-btn off');
  document.getElementById('mirror-line-x').style.display = 'none';
  document.getElementById('mirror-line-y').style.display = 'none';
  alert('✅ Espejo aplicado');
}

// ─── CALIBRATION ─────────────────────────────────────────────────────────────
let calibFactor = 1.0; // how many real cm per screen cm

function showCalib() {
  // Show calib box at current pxPerCm size
  const box = document.getElementById('calib-box');
  const targetPx = Math.round(20 * pxPerCm);
  box.style.width  = targetPx + 'px';
  box.style.height = targetPx + 'px';
  document.getElementById('calib-modal').classList.remove('hidden');
}

function adjustCalibBox(delta) {
  const box = document.getElementById('calib-box');
  let current = parseInt(box.style.width) || 150;
  current = Math.max(40, Math.min(current + delta, 400));
  box.style.width  = current + 'px';
  box.style.height = current + 'px';
  // Update pxPerCm live so user can see effect
  const newPxPerCm = current / 20;
  document.getElementById('calib-measured').placeholder = 'ej: ' + (20 * (pxPerCm / newPxPerCm)).toFixed(1);
}

function applyCalib() {
  const measured = parseFloat(document.getElementById('calib-measured').value);
  if (!measured || measured <= 0) { alert('Ingresa la medida real'); return; }
  // We showed 20cm reference, they measured X cm in tela
  calibFactor = measured / 20;
  // Adjust pxPerCm so patterns render at real scale
  // If projected 20cm → measured 25cm, we need to shrink by factor 20/25
  const correction = 20 / measured;
  pxPerCm = pxPerCm * correction;
  localStorage.setItem('calib_factor', calibFactor);
  localStorage.setItem('calib_pxPerCm', pxPerCm);
  document.getElementById('calib-result').textContent =
    '✅ Calibrado! Factor: ' + calibFactor.toFixed(3) + ' · 1 cm pantalla = ' + (1/calibFactor).toFixed(2) + ' cm tela';
  redrawBase();
  setTimeout(() => closeModal('calib-modal'), 1500);
}

  if (saved) pxPerCm = parseFloat(saved);
  calibFactor = parseFloat(localStorage.getItem('calib_factor') || '1');
})();

// ─── PROJECTION MODE ─────────────────────────────────────────────────────────
let projScaleFactor = 1.0;
let projOffsetX = 0, projOffsetY = 0;
let projCtx = null;

function showProjection() {
  const overlay = document.getElementById('proj-overlay');
  overlay.classList.remove('hidden');
  const pc = document.getElementById('proj-canvas');
  pc.width  = window.screen.width  * (window.devicePixelRatio || 1);
  pc.height = window.screen.height * (window.devicePixelRatio || 1);
  pc.style.width  = window.innerWidth  + 'px';
  pc.style.height = (window.innerHeight - 60) + 'px';
  projCtx = pc.getContext('2d');
  projScaleFactor = 1.0;
  projOffsetX = 0; projOffsetY = 0;
  renderProjection();
  // request fullscreen for better projection
  if (overlay.requestFullscreen) overlay.requestFullscreen().catch(() => {});
}

function renderProjection() {
  if (!projCtx) return;
  const pc = document.getElementById('proj-canvas');
  projCtx.clearRect(0, 0, pc.width, pc.height);
  projCtx.fillStyle = '#000';
  projCtx.fillRect(0, 0, pc.width, pc.height);

  projCtx.save();
  projCtx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  projCtx.translate(projOffsetX, projOffsetY);
  projCtx.scale(projScaleFactor, projScaleFactor);

  // Draw basic layer
  if (basicSnap && basicVisible) {
    const tmp = document.createElement('canvas');
    tmp.width = canvasBase.width; tmp.height = canvasBase.height;
    tmp.getContext('2d').putImageData(basicSnap, 0, 0);
    projCtx.drawImage(tmp, 0, 0, canvasBase.width / dpr, canvasBase.height / dpr);
  }
  // Draw pattern layer — white on black for max contrast
  const tmp2 = document.createElement('canvas');
  tmp2.width = canvasDraw.width; tmp2.height = canvasDraw.height;
  const tc2 = tmp2.getContext('2d');
  tc2.putImageData(ctxDraw.getImageData(0,0,canvasDraw.width,canvasDraw.height), 0, 0);
  projCtx.drawImage(tmp2, 0, 0, canvasDraw.width / dpr, canvasDraw.height / dpr);

  // Calibration grid overlay (every 10cm)
  projCtx.strokeStyle = '#ffffff15';
  projCtx.lineWidth = 0.5;
  const cmPx = pxPerCm * projScaleFactor;
  for (let x = 0; x < window.innerWidth / projScaleFactor + 500; x += pxPerCm * 10) {
    projCtx.beginPath(); projCtx.moveTo(x, 0); projCtx.lineTo(x, window.innerHeight); projCtx.stroke();
  }
  for (let y = 0; y < window.innerHeight / projScaleFactor + 500; y += pxPerCm * 10) {
    projCtx.beginPath(); projCtx.moveTo(0, y); projCtx.lineTo(window.innerWidth, y); projCtx.stroke();
  }

  projCtx.restore();
  document.getElementById('proj-scale-label').textContent = Math.round(projScaleFactor * 100) + '%';
}

function projScale(delta) {
  projScaleFactor = Math.max(0.3, Math.min(5, projScaleFactor + delta));
  renderProjection();
}
function projMove(dx, dy) {
  projOffsetX += dx; projOffsetY += dy;
  renderProjection();
}
function exitProjection() {
  document.getElementById('proj-overlay').classList.add('hidden');
  if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
}

        <div style="position:absolute;top:6px;left:6px;width:2px;height:12px;background:#00FF00;"></div>
        <div style="position:absolute;top:6px;right:6px;width:12px;height:2px;background:#00FF00;"></div>
        <div style="position:absolute;top:6px;right:6px;width:2px;height:12px;background:#00FF00;"></div>
        <div style="position:absolute;bottom:6px;left:6px;width:12px;height:2px;background:#00FF00;"></div>
        <div style="position:absolute;bottom:6px;left:6px;width:2px;height:12px;background:#00FF00;"></div>
        <div style="position:absolute;bottom:6px;right:6px;width:12px;height:2px;background:#00FF00;"></div>
        <div style="position:absolute;bottom:6px;right:6px;width:2px;height:12px;background:#00FF00;"></div>
        <!-- líneas cruzadas centro -->
        <div style="position:absolute;top:50%;left:10%;right:10%;height:1px;background:#00FF0055;"></div>
        <div style="position:absolute;left:50%;top:10%;bottom:10%;width:1px;background:#00FF0055;"></div>
        <span style="font-size:20px;font-weight:900;color:#00FF00;">20×20</span>

    <!-- AJUSTE DE TAMAÑO DEL CUADRO -->

<!-- PROJECTION OVERLAY -->
<div id="proj-overlay" class="hidden">

<!-- ═══════════════════════════════════════════════════════════════════════════
     MÓDULO: ESCANEO CON CÁMARA
     Fase 1: Foto como referencia (trazar encima)
     Fase 2: Detección automática de bordes (Sobel, pure JS, 100% offline)
     ═══════════════════════════════════════════════════════════════════════════ -->
<div id="modal-cam" class="modal-bg hidden">
  <div style="background:#0d1b2a;border:1px solid #00d4ff55;border-radius:16px;padding:16px;width:96%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px #000c;">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div>
        <h2 style="color:#00d4ff;font-size:15px;margin:0;">📷 Escanear Patrón</h2>
        <p style="font-size:10px;color:#555;margin:2px 0 0;">Captura con la cámara y digitaliza</p>
      </div>
      <button onclick="camClose()" style="background:#e53935;border:none;color:#fff;border-radius:8px;padding:6px 13px;font-size:14px;cursor:pointer;">✖</button>
    </div>

    <!-- ── LIVE: vista en vivo de la cámara ──────────────────────────── -->
    <div id="cam-live-sec">
      <div style="position:relative;background:#000;border-radius:10px;overflow:hidden;margin-bottom:12px;">
        <video id="cam-vid" autoplay playsinline muted></video>
        <div id="cam-status" style="position:absolute;top:8px;left:8px;color:#ff6d6d;font-size:11px;background:#000b;padding:4px 8px;border-radius:6px;max-width:92%;line-height:1.4;"></div>
        <!-- guía de encuadre -->
        <div style="position:absolute;inset:10%;border:1px dashed #ffffff22;border-radius:4px;pointer-events:none;"></div>
        <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffff55;">Centra el patrón dentro del marco</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;align-items:center;">
        <button onclick="camFlip()" style="padding:9px 14px;background:#0f3460;border:none;color:#aaa;border-radius:10px;font-size:12px;cursor:pointer;">🔄 Voltear</button>
        <button onclick="camCapture()" style="padding:13px 32px;background:linear-gradient(135deg,#00d4ff,#0088bb);border:none;color:#000;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 20px #00d4ff44;">📸 CAPTURAR</button>
        <button onclick="camClose()" style="padding:9px 14px;background:#333;border:none;color:#aaa;border-radius:10px;font-size:12px;cursor:pointer;">✖ Salir</button>
      </div>
    </div>

    <!-- ── RESULT: foto capturada + opciones ────────────────────────── -->
    <div id="cam-result-sec" style="display:none;">

      <!-- FASE 1 -->
      <div class="cam-card cam-card-green">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span class="cam-phase-badge" style="background:#00c853;color:#000;">FASE 1</span>
          <span style="font-size:12px;color:#fff;">Foto como referencia — traza encima</span>
        </div>
        <img id="cam-preview" src="" style="margin-bottom:10px;">
        <p style="font-size:10px;color:#888;margin-bottom:8px;">La foto se coloca al 45% de opacidad en el lienzo para que puedas trazar los contornos del patrón manualmente encima.</p>
        <button onclick="camPlace(false)" style="width:100%;padding:11px;background:linear-gradient(135deg,#00c853,#009e40);border:none;color:#000;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;">
          📌 Colocar Foto en Lienzo
        </button>
      </div>

      <!-- FASE 2 -->
      <div class="cam-card cam-card-blue">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span class="cam-phase-badge" style="background:#00d4ff;color:#000;">FASE 2</span>
          <span style="font-size:12px;color:#fff;">Detección automática de bordes</span>
        </div>
        <p style="font-size:10px;color:#888;margin-bottom:10px;">El algoritmo Sobel extrae automáticamente el contorno del patrón como líneas de color sobre fondo transparente.</p>

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="font-size:11px;color:#aaa;white-space:nowrap;">Sensibilidad:</span>
          <input type="range" id="cam-thresh" min="8" max="120" value="40"
            oninput="document.getElementById('cam-thresh-val').textContent=this.value;"
            style="flex:1;accent-color:#00d4ff;">
          <span id="cam-thresh-val" style="font-size:11px;color:#00d4ff;min-width:26px;text-align:right;">40</span>
        </div>
        <p style="font-size:10px;color:#555;margin-bottom:8px;">⬅ Mayor sensibilidad = más detalles finos (puede haber ruido). Menos = solo bordes principales.</p>

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <span style="font-size:11px;color:#aaa;white-space:nowrap;">Color bordes:</span>
          <input type="color" id="cam-edge-color" value="#00ffff"
            style="width:40px;height:30px;padding:2px;background:#0f3460;border:1px solid #00d4ff33;border-radius:6px;cursor:pointer;">
          <span style="font-size:10px;color:#555;">Cian o verde = mejor visibilidad sobre el lienzo oscuro</span>
        </div>

        <button id="cam-btn-detect" onclick="camDetectEdges()" style="width:100%;padding:11px;background:linear-gradient(135deg,#ff6d00,#cc5000);border:none;color:#fff;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:8px;">
          🔍 Detectar Bordes Automáticamente
        </button>
        <div id="cam-edge-status" style="font-size:11px;color:#00c853;text-align:center;min-height:18px;margin-bottom:6px;"></div>

        <!-- Vista previa de bordes -->
        <div id="cam-edge-wrap" style="display:none;">
          <p style="font-size:10px;color:#aaa;margin-bottom:6px;">🔍 Vista previa — bordes detectados (fondo negro = transparente en lienzo):</p>
          <img id="cam-edge-prev" src="" style="margin-bottom:10px;border:1px solid #00d4ff22;">
          <div style="display:flex;gap:8px;margin-bottom:4px;">
            <button onclick="camDetectEdges()" style="flex:1;padding:8px;background:#0f3460;border:none;color:#aaa;border-radius:8px;font-size:11px;cursor:pointer;">🔄 Re-aplicar ajustes</button>
            <button id="cam-btn-place-edge" onclick="camPlace(true)" style="flex:2;padding:8px;background:linear-gradient(135deg,#00d4ff,#0088bb);border:none;color:#000;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;">
              📌 Colocar Bordes en Lienzo
            </button>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:8px;">
        <button onclick="camRetake()" style="flex:1;padding:9px;background:#333;border:none;color:#fff;border-radius:8px;font-size:12px;cursor:pointer;">🔄 Nueva foto</button>
        <button onclick="camClose()" style="flex:1;padding:9px;background:#e53935;border:none;color:#fff;border-radius:8px;font-size:12px;cursor:pointer;">✖ Cancelar</button>
      </div>
    </div>

    <canvas id="cam-cvs" style="display:none;"></canvas>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// MÓDULO CÁMARA — Fase 1 (captura) + Fase 2 (Sobel edge detection)
// Pure JS, 100% offline, sin librerías externas
// ═══════════════════════════════════════════════════════════════════════════════

var camStream   = null;
var camCaptured = null;   // data URL de la foto capturada
var camEdged    = null;   // data URL del resultado de detección de bordes
var camFacing   = 'environment'; // 'environment' = cámara trasera

// ─── Abrir modal ─────────────────────────────────────────────────────────────
function openCamModal() {
  document.getElementById('modal-cam').classList.remove('hidden');
  _camShowSec('live');
  _camStart();
}

// ─── Iniciar stream de cámara ────────────────────────────────────────────────
function _camStart() {
  _camStop();
  var statusEl = document.getElementById('cam-status');
  statusEl.textContent = '⏳ Iniciando cámara...';

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusEl.textContent = '❌ Tu dispositivo o navegador no soporta acceso a la cámara.\nUsa el botón "📥 Importar" para cargar una foto desde la galería.';
    return;
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: camFacing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  }).then(function(stream) {
    camStream = stream;
    var vid = document.getElementById('cam-vid');
    vid.srcObject = stream;
    vid.play();
    statusEl.textContent = '';
  }).catch(function(e) {
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      statusEl.textContent = '❌ Permiso de cámara denegado.\nEn Android: Ajustes → Apps → Mesa de Corte Pro → Permisos → Cámara → Permitir';
    } else if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') {
      statusEl.textContent = '❌ No se encontró cámara en este dispositivo.';
    } else if (e.name === 'NotReadableError') {
      statusEl.textContent = '❌ La cámara está siendo usada por otra app.';
    } else {
      statusEl.textContent = '❌ Error: ' + e.name + ' — ' + e.message;
    }
  });
}

// ─── Detener stream ───────────────────────────────────────────────────────────
function _camStop() {
  if (camStream) {
    camStream.getTracks().forEach(function(t) { t.stop(); });
    camStream = null;
  }
}

// ─── Mostrar sección ──────────────────────────────────────────────────────────
function _camShowSec(which) {
  document.getElementById('cam-live-sec').style.display   = (which === 'live')   ? '' : 'none';
  document.getElementById('cam-result-sec').style.display = (which === 'result') ? '' : 'none';
}

// ─── Voltear cámara (frontal ↔ trasera) ──────────────────────────────────────
function camFlip() {
  camFacing = (camFacing === 'environment') ? 'user' : 'environment';
  _camStart();
}

// ─── CAPTURAR foto desde el video ────────────────────────────────────────────
function camCapture() {
  var vid = document.getElementById('cam-vid');
  if (!vid.videoWidth) { alert('La cámara aún no está lista. Espera un momento.'); return; }

  var cvs = document.getElementById('cam-cvs');
  cvs.width  = vid.videoWidth;
  cvs.height = vid.videoHeight;
  cvs.getContext('2d').drawImage(vid, 0, 0);

  camCaptured = cvs.toDataURL('image/jpeg', 0.92);
  camEdged    = null;
  _camStop();

  document.getElementById('cam-preview').src      = camCaptured;
  document.getElementById('cam-edge-wrap').style.display  = 'none';
  document.getElementById('cam-edge-status').textContent  = '';
  _camShowSec('result');
}

// ─── Volver a capturar ────────────────────────────────────────────────────────
function camRetake() {
  _camShowSec('live');
  _camStart();
}

// ─── Cerrar modal ─────────────────────────────────────────────────────────────
function camClose() {
  _camStop();
  document.getElementById('modal-cam').classList.add('hidden');
}

// ═══════════════════════════════════════════════════════════════════════════════
// FASE 2 — Algoritmo Sobel (detección de bordes, pure JS)
// ═══════════════════════════════════════════════════════════════════════════════
function camDetectEdges() {
  if (!camCaptured) return;
  var statusEl = document.getElementById('cam-edge-status');
  var btn = document.getElementById('cam-btn-detect');
  statusEl.textContent = '⏳ Procesando bordes...';
  btn.disabled = true;

  // Usamos setTimeout para que la UI se actualice antes de bloquear con el cálculo
  setTimeout(function() {
    try {
      var img = new Image();
      img.onerror = function() {
        statusEl.textContent = '❌ Error cargando imagen.';
        btn.disabled = false;
      };
      img.onload = function() {
        // ── Paso 1: reducir tamaño para rendimiento (max 800px ancho) ──
        var MAX_W = 800;
        var sw = img.width, sh = img.height;
        if (sw > MAX_W) { sh = Math.round(sh * MAX_W / sw); sw = MAX_W; }

        var src = document.createElement('canvas');
        src.width = sw; src.height = sh;
        src.getContext('2d').drawImage(img, 0, 0, sw, sh);
        var idata = src.getContext('2d').getImageData(0, 0, sw, sh);
        var d = idata.data;

        // ── Paso 2: convertir a escala de grises ──────────────────────
        var gray = new Float32Array(sw * sh);
        for (var i = 0; i < sw * sh; i++) {
          gray[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2];
        }

        // ── Paso 3: blur 3×3 (reducción de ruido) ────────────────────
        var blr = new Float32Array(sw * sh);
        for (var y = 1; y < sh-1; y++) {
          for (var x = 1; x < sw-1; x++) {
            var s = 0;
            for (var dy = -1; dy <= 1; dy++)
              for (var dx = -1; dx <= 1; dx++)
                s += gray[(y+dy)*sw+(x+dx)];
            blr[y*sw+x] = s / 9;
          }
        }
        // Bordes del canvas (sin procesar)
        for (var bx = 0; bx < sw; bx++) { blr[bx] = gray[bx]; blr[(sh-1)*sw+bx] = gray[(sh-1)*sw+bx]; }
        for (var by = 0; by < sh; by++) { blr[by*sw] = gray[by*sw]; blr[by*sw+sw-1] = gray[by*sw+sw-1]; }

        // ── Paso 4: operador Sobel ────────────────────────────────────
        var thresh = parseInt(document.getElementById('cam-thresh').value) || 40;
        var hex    = document.getElementById('cam-edge-color').value || '#00ffff';
        var er = parseInt(hex.slice(1,3),16);
        var eg = parseInt(hex.slice(3,5),16);
        var eb = parseInt(hex.slice(5,7),16);

        var out = new Uint8ClampedArray(sw * sh * 4);

        for (var ey = 1; ey < sh-1; ey++) {
          for (var ex = 1; ex < sw-1; ex++) {
            // Kernel Sobel horizontal (Gx)
            var gx = (
              -1*blr[(ey-1)*sw+(ex-1)] + 1*blr[(ey-1)*sw+(ex+1)] +
              -2*blr[ ey   *sw+(ex-1)] + 2*blr[ ey   *sw+(ex+1)] +
              -1*blr[(ey+1)*sw+(ex-1)] + 1*blr[(ey+1)*sw+(ex+1)]
            );
            // Kernel Sobel vertical (Gy)
            var gy = (
              -1*blr[(ey-1)*sw+(ex-1)] - 2*blr[(ey-1)*sw+ex] - 1*blr[(ey-1)*sw+(ex+1)] +
               1*blr[(ey+1)*sw+(ex-1)] + 2*blr[(ey+1)*sw+ex] + 1*blr[(ey+1)*sw+(ex+1)]
            );
            // Magnitud del gradiente
            var mag = Math.sqrt(gx*gx + gy*gy);
            var oi  = (ey*sw+ex)*4;

            if (mag > thresh) {
              // Píxel = color elegido, opacidad proporcional a la magnitud
              out[oi]   = er;
              out[oi+1] = eg;
              out[oi+2] = eb;
              out[oi+3] = Math.min(255, Math.round(mag * 1.8));
            } else {
              // Fondo transparente (se verá el canvas de dibujo debajo)
              out[oi+3] = 0;
            }
          }
        }

        // ── Paso 5: renderizar resultado ──────────────────────────────
        var dst = document.createElement('canvas');
        dst.width = sw; dst.height = sh;
        dst.getContext('2d').putImageData(new ImageData(out, sw, sh), 0, 0);
        camEdged = dst.toDataURL('image/png');

        document.getElementById('cam-edge-prev').src = camEdged;
        document.getElementById('cam-edge-wrap').style.display = '';
        statusEl.textContent = '✅ ¡Bordes detectados! Ajusta la sensibilidad si necesitas más o menos detalle.';
        btn.disabled = false;
      };
      img.src = camCaptured;
    } catch(e) {
      statusEl.textContent = '❌ Error interno: ' + e.message;
      btn.disabled = false;
    }
  }, 80);
}

// ═══════════════════════════════════════════════════════════════════════════════
// COLOCAR IMAGEN EN EL LIENZO DE DIBUJO
// ═══════════════════════════════════════════════════════════════════════════════
function camPlace(useEdge) {
  var imgSrc = useEdge ? camEdged : camCaptured;
  if (!imgSrc) { alert('Sin imagen para colocar'); return; }

  var img = new Image();
  img.onload = function() {
    saveHistory();
    ctxDraw.save();

    // Ajustar al canvas manteniendo proporción
    var cw = canvasDraw.width  / (window.devicePixelRatio || 1);
    var ch = canvasDraw.height / (window.devicePixelRatio || 1);
    var fit = Math.min(cw / img.width, ch / img.height);
    var dw  = img.width  * fit;
    var dh  = img.height * fit;
    var dx  = (cw - dw) / 2;
    var dy  = (ch - dh) / 2;

    if (!useEdge) {
      // Fase 1: foto translúcida para trazar encima
      ctxDraw.globalAlpha = 0.45;
    }
    // Fase 2: bordes en color sobre fondo transparente (alpha real de la imagen PNG)
    ctxDraw.drawImage(img, dx, dy, dw, dh);
    ctxDraw.globalAlpha = 1.0;
    ctxDraw.restore();

    camClose();

    if (useEdge) {
      alert('✅ Bordes detectados colocados en el lienzo.\n\n• Usa las herramientas de trazado para repasar las líneas del patrón.\n• Ajusta la sensibilidad y vuelve a colocar si necesitas más detalle.');
    } else {
      alert('✅ Foto colocada como referencia (45% opacidad).\n\n• Traza los contornos del patrón encima con el lápiz o línea.\n• Cuando termines, puedes limpiar y quedará solo tu trazo.');
    }
  };
  img.onerror = function() { alert('Error al cargar la imagen'); };
  img.src = imgSrc;
}
</script>
